name: Kronos Lab

# ローソク足AI「Kronos」の予測を毎日記録して答え合わせする実験（docs/kronos.html）。
# スクリーナー（16:30 JST）と重ならないよう、大引け後 17:20 JST に実行する。

on:
  schedule:
    - cron: '20 8 * * 1-5'  # 平日 17:20 JST (UTC 8:20)
  workflow_dispatch:

concurrency:
  group: kronos-lab
  cancel-in-progress: false

jobs:
  kronos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Kronos のソースはレビュー済みのコミットに固定（サプライチェーン対策）
      KRONOS_REPO: https://github.com/shiyu-coder/Kronos.git
      KRONOS_COMMIT: 67b630e67f6a18c9e9be918d9b4337c960db1e9a

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-kronos.txt

      - name: Install dependencies (CPU版 PyTorch)
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-kronos.txt

      - name: Fetch Kronos source (pinned commit)
        run: |
          git init -q kronos_src
          git -C kronos_src remote add origin "$KRONOS_REPO"
          git -C kronos_src fetch -q --depth 1 origin "$KRONOS_COMMIT"
          git -C kronos_src checkout -q FETCH_HEAD
          test "$(git -C kronos_src rev-parse HEAD)" = "$KRONOS_COMMIT"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-small-v1

      - name: Run Kronos lab
        env:
          PYTHONPATH: kronos_src
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python kronos_lab.py

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/kronos.html docs/data/kronos_log.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: kronos lab $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M JST')"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 15
          done
          exit 1
